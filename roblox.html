<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Launcher</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #111;
}

.header {
  background: #ffffff;
  padding: 18px 26px;
  font-size: 20px;
  font-weight: 700;
}

.searchbar {
  display: flex;
  justify-content: center;
  padding: 18px;
}

.searchbar input {
  width: 100%;
  max-width: 520px;
  padding: 12px 16px;
  border-radius: 999px;
  border: none;
  outline: none;
  background: #eeeeee;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 10px 20px 40px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 18px;
}

.card {
  background: #fff;
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 22px rgba(0,0,0,0.10);
}

.thumb {
  width: 100%;
  aspect-ratio: 16 / 10;
  background: #e9e9e9;
  border-radius: 22px 22px 0 0;
  overflow: hidden;
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.info {
  padding: 12px 14px 14px;
}

.title {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 4px;
}

.desc {
  font-size: 12.5px;
  color: #666;
  margin-bottom: 10px;
}

.play {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 999px;
  background: #00a2ff;
  color: white;
  font-weight: 700;
  cursor: pointer;
}

.play:hover {
  background: #008bd6;
}
</style>
</head>

<body>

<div class="header">Roblox Web Launcher</div>

<div class="searchbar">
  <input id="search" placeholder="Search games...">
</div>

<div class="container">
  <div class="grid" id="grid"></div>
</div>

<script>
const games = [
  {
    title: "99 Nights in the Forest",
    desc: "Save the kids and explore the forest i guess..",
    file: "games/99n.html",
    img: "pngs/99n.png"
  },
  {
    title: "Grow a Garden",
    desc: "Grow plants and sell them.",
    file: "games/garden.html",
    img: "pngs/garden.png"
  }
];

const grid = document.getElementById("grid");

function render(filter = "") {
  grid.innerHTML = "";

  games
    .filter(g => g.title.toLowerCase().includes(filter.toLowerCase()))
    .forEach(game => {
      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <div class="thumb">
          <img src="${game.img}" alt="${game.title}">
        </div>
        <div class="info">
          <div class="title">${game.title}</div>
          <div class="desc">${game.desc}</div>
          <button class="play" onclick="playGame('${game.file}')">Play</button>
        </div>
      `;

      grid.appendChild(card);
    });
}

function playGame(file) {
  window.location.href = file;
}

document.getElementById("search").addEventListener("input", e => {
  render(e.target.value);
});

render();
</script>

</body>
</html>
