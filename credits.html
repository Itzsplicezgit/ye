<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Credits</title>

<style>
  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: #0b0b0b;
    color: white;
  }

  .wrapper {
    max-width: 900px;
    margin: auto;
    padding: 30px 20px;
  }

  .section {
    background: #151515;
    border-radius: 24px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .section h2 {
    margin: 0 0 15px;
    font-size: 18px;
    font-weight: 700;
  }

  .info {
    font-size: 14px;
    color: #aaa;
    line-height: 1.6;
    white-space: pre-line;
  }

  .toggle {
    margin-top: 12px;
    width: 100%;
    padding: 12px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    background: #1a1a1a;
    color: white;
  }

  .toggle.on {
    background: white;
    color: black;
  }

</style>
</head>

<body>

<div class="wrapper">

  <div class="section">
    <h2>Credits</h2>
    <div class="info">
@Itzsplicez
Creator of Waypoint
    </div>
  </div>

  <div class="section">
    <h2>Developer Mode</h2>
    <div class="info">
Enables experimental features (currently inactive)
    </div>

    <button id="devBtn" class="toggle" onclick="toggleDev()">
      Developer Mode: OFF
    </button>
  </div>

</div>

<script>
  const btn = document.getElementById("devBtn");

  function setState(state) {
    if (state) {
      btn.classList.add("on");
      btn.textContent = "Developer Mode: ON";
    } else {
      btn.classList.remove("on");
      btn.textContent = "Developer Mode: OFF";
    }
  }

  function toggleDev() {
    const current = localStorage.getItem("devMode") === "true";
    const next = !current;

    localStorage.setItem("devMode", next);
    setState(next);
  }

  const saved = localStorage.getItem("devMode") === "true";
  setState(saved);
</script>

</body>
</html>
