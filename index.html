<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Waypoint</title>

<style>
  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: #0b0b0b;
    color: white;
    overflow: hidden;
  }

  .loading {
    position: fixed;
    inset: 0;
    background: #0b0b0b;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    transition: opacity 0.6s ease;
  }

  .loading.fade {
    opacity: 0;
    pointer-events: none;
  }

  .loading-title {
    position: relative;
    font-size: 96px;
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1;
  }

  .version {
    position: absolute;
    right: 6px;
    bottom: -10px;
    font-size: 14px;
    font-weight: 500;
    color: #666;
    letter-spacing: 0;
  }

  .app {
    display: flex;
    height: 100vh;
  }

  .sidebar {
    width: 20%;
    min-width: 200px;
    max-width: 320px;
    background: #111;
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
  }

  .logo {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 40px;
  }

  .nav {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .nav button {
    padding: 14px;
    border-radius: 999px;
    border: none;
    background: #1a1a1a;
    color: white;
    font-size: 14px;
    cursor: pointer;
    text-align: left;
    padding-left: 18px;
  }

  .nav button:hover {
    background: #2a2a2a;
  }

  .nav button.active {
    background: white;
    color: black;
    font-weight: 600;
  }

  .content {
    flex: 1;
    background: #0b0b0b;
    position: relative;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  .dock {
    position: absolute;
    top: 12px;
    right: 12px;
    display: none;
    gap: 8px;
    z-index: 10;
  }

  .dock button {
    border: none;
    border-radius: 10px;
    width: 38px;
    height: 38px;
    background: #1a1a1a;
    color: white;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .dock button:hover {
    background: #2a2a2a;
  }

  .fullscreen .sidebar {
    display: none;
  }

  .fullscreen .content {
    width: 100%;
  }
</style>
</head>

<body>

<div class="loading" id="loading">
  <div class="loading-title">
    Waypoint
    <div class="version">v1.0.1</div>
  </div>
</div>

<div class="app" id="app">
  <div class="sidebar">
    <div class="logo">Waypoint</div>

    <div class="nav">
      <button class="active" onclick="loadPage('lib.html', this)">Home</button>
      <button onclick="loadPage('settings.html', this)">Settings</button>
      <button onclick="loadPage('credits.html', this)">Credits</button>
    </div>
  </div>

  <div class="content">
    <div class="dock" id="dock">
      <button onclick="toggleFullscreen()">⛶</button>
      <button onclick="closeGame()">✕</button>
    </div>
    <iframe id="frame" src="lib.html"></iframe>
  </div>
</div>

<script>
  const frame = document.getElementById("frame");
  const buttons = document.querySelectorAll(".nav button");
  const app = document.getElementById("app");
  const dock = document.getElementById("dock");

  function loadPage(page, btn) {
    frame.src = page;
    buttons.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    exitGameMode();
  }

  function enterGame(file) {
    frame.src = file;
    app.classList.add("fullscreen");
    dock.style.display = "flex";
  }

  function exitGameMode() {
    app.classList.remove("fullscreen");
    dock.style.display = "none";
  }

  function closeGame() {
    frame.src = "lib.html";
    exitGameMode();
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }

  window.addEventListener("message", (event) => {
    const data = event.data;

    if (data?.type === "clearData") {
      location.reload();
    }

    if (data?.type === "launchGame") {
      enterGame(data.file);
    }
  });

  window.addEventListener("load", () => {
    setTimeout(() => {
      document.getElementById("loading").classList.add("fade");
    }, 3000);
  });
</script>

</body>
</html>
