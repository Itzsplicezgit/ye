<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Page</title>
    <style>
        body {
            background-color: white;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Top-left links */
        .link-container {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px; /* 2x bigger */
            color: black;
        }
        .link-container a {
            display: block;
            color: black;
            text-decoration: none;
            margin-top: 4px;
        }
        .link-container a:hover {
            text-decoration: underline;
        }
        .label {
            font-weight: bold;
            margin-bottom: 6px;
        }
        /* Center message */
        .center-message {
            font-size: 48px;
            font-weight: bold;
            color: black;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="link-container">
        <div class="label">Links:</div>
        <a href="files.html">Books</a>
    </div>

    <div class="center-message">EVENT SOON!</div>
</body>
</html>
