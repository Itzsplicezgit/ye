<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crossy Road</title>

  <!-- Allow iframe-friendly behavior -->
  <meta http-equiv="Content-Security-Policy" content="frame-ancestors *">

  <!-- Base path (keep, but make sure assets actually resolve) -->
  <base href="https://cdn.jsdelivr.net/gh/bubbls/youtube-playables@latest/crossy-road/">

  <!-- Load SDK FIRST -->
  <script src="https://cdn.jsdelivr.net/gh/bubbls/youtube-playables@main/ytgame.js"></script>

  <link rel="stylesheet" href="style.css">

  <!-- Core libs -->
  <script src="scripts/three.min.js"></script>
  <script src="scripts/game.min.js"></script>
  <script src="scripts/extra.min.js"></script>
  <script src="scripts/bootstrap.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
      height: 100%;
    }

    canvas {
      display: block;
    }

    #build-number {
      position: absolute;
      bottom: 5px;
      right: 10px;
      font-size: 12px;
      color: white;
      opacity: 0.5;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <div id="build-number"></div>

  <script>
    // iframe safety check (helps debugging)
    console.log("In iframe:", window.self !== window.top);
  </script>
</body>
</html>
